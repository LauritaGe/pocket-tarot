<title>Pocket Tarot</title>
<style>
  :root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
  :root{color-scheme:light dark;
    --bg:light-dark(#e8e4d8,#1d1c19); --case:#efc03f; --case-dark:#d4a52a; --case-light:#f7d469;
    --paper:#d8d5c8; --ink:#1d1d1b; --muted:#8a8470;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%; overscroll-behavior:none; touch-action:manipulation}
  body{
    background:var(--bg); color:var(--ink);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; min-height:100dvh;
    padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
    -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  }
  .device{
    position:relative; background:var(--case); border-radius:30px;
    padding:18px 18px 22px;
    box-shadow: inset 0 2px 0 var(--case-light), inset 0 -4px 0 var(--case-dark),
                0 18px 40px -18px rgba(60,45,0,.45), 0 2px 4px rgba(60,45,0,.15);
    display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  .bezel{
    background:var(--case-dark); padding:6px; border-radius:10px;
    box-shadow: inset 0 2px 3px rgba(0,0,0,.25);
  }
  canvas{
    display:block; background:var(--paper); border-radius:4px;
    image-rendering:pixelated; image-rendering:crisp-edges; cursor:pointer; touch-action:none;
  }
  .row{display:flex; align-items:center; gap:22px}
  .btn{
    width:56px; height:56px; border-radius:50%; border:none; cursor:pointer;
    background:var(--case);
    box-shadow: 0 4px 0 var(--case-dark), inset 0 2px 0 var(--case-light), 0 6px 10px -4px rgba(60,45,0,.4);
    transition: transform .06s, box-shadow .06s; outline:none; touch-action:none;
  }
  .btn:active,.btn.down{transform:translateY(3px); box-shadow:0 1px 0 var(--case-dark), inset 0 2px 0 var(--case-light)}
  .btn:focus-visible{outline:2px solid var(--ink); outline-offset:4px}
  .hint{font-size:11px; letter-spacing:.14em; color:var(--muted); text-align:center; line-height:1.7}
</style>
</head>

// ─── Framebuffer e-ink 152x304, 1 bit ─────────────────────
const FW = 152, FH = 304;
const fb = new Uint8Array(FW * FH);
const cv = document.getElementById("eink");
const ctx = cv.getContext("2d");
const img = ctx.createImageData(FW, FH);
const PAPER = [216,213,200], INK = [29,29,27];

function flush(){
  for (let i = 0; i < fb.length; i++){
    const c = fb[i] ? INK : PAPER, j = i * 4;
    img.data[j] = c[0]; img.data[j+1] = c[1]; img.data[j+2] = c[2]; img.data[j+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}
const clear = (v = 0) => fb.fill(v);
function px(x, y, v = 1){ if (x >= 0 && y >= 0 && x < FW && y < FH) fb[y * FW + x] = v; }
function hline(x0, x1, y, v = 1){ for (let x = x0; x <= x1; x++) px(x, y, v); }
function vline(x, y0, y1, v = 1){ for (let y = y0; y <= y1; y++) px(x, y, v); }
function rect(x0, y0, x1, y1, t = 1){
  for (let k = 0; k < t; k++){ hline(x0+k, x1-k, y0+k); hline(x0+k, x1-k, y1-k); vline(x0+k, y0+k, y1-k); vline(x1-k, y0+k, y1-k); }
}
function fillRect(x0, y0, x1, y1, v = 1){ for (let y = y0; y <= y1; y++) hline(x0, x1, y, v); }

// Decodifica un bitmap en hexadecimal (cada fila = w/4 dígitos) y lo dibuja
function blitHex(hex, w, h, x0, y0){
  const s = hex.replace(/\s+/g, ""), rowLen = w / 4;
  for (let y = 0; y < h; y++){
    for (let c = 0; c < rowLen; c++){
      const nib = parseInt(s[y * rowLen + c], 16);
      for (let b = 0; b < 4; b++) if (nib & (8 >> b)) px(x0 + c * 4 + b, y0 + y);
    }
  }
}
function rotateRegion(x0, y0, x1, y1){
  const w = x1 - x0 + 1, h = y1 - y0 + 1, tmp = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) tmp[y*w+x] = fb[(y0+y)*FW + x0+x];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) fb[(y0+y)*FW + x0+x] = tmp[(h-1-y)*w + (w-1-x)];
}

// ─── Texto con fuente hexadecimal 5x10 ────────────────────
const ADV = 6;
function glyph(ch, x0, y0, s){
  const g = FUENTE[ch] || FUENTE[" "];
  for (let r = 0; r < 10; r++){
    const row = parseInt(g.substr(r * 2, 2), 16);
    for (let b = 0; b < 5; b++) if (row & (0x80 >> b)) fillRect(x0 + b*s, y0 + r*s, x0 + b*s + s - 1, y0 + r*s + s - 1);
  }
}
const textW = (t, s) => t.length * ADV * s - s;
function text(t, x, y, s = 1){ [...t].forEach((ch, i) => glyph(ch, x + i * ADV * s, y, s)); }
function center(t, y, s = 1){ text(t, Math.round((FW - textW(t, s)) / 2), y, s); }
function wrap(t, maxW, s){
  const out = []; let line = "";
  for (const w of t.split(" ")){
    const tryL = line ? line + " " + w : w;
    if (textW(tryL, s) <= maxW) line = tryL; else { if (line) out.push(line); line = w; }
  }
  if (line) out.push(line);
  return out;
}
// Escribe centrado; usa 2x si entra, si no 1x. Devuelve nueva y.
function block(t, y, pref = 2, maxW = 144){
  let s = pref, lines = wrap(t, maxW, s);
  if (s === 2 && lines.some(l => textW(l, 2) > maxW)) { s = 1; lines = wrap(t, maxW, 1); }
  for (const l of lines){ center(l, y, s); y += 10 * s + (s === 2 ? 0 : 1); }
  return y;
}

}
function drawBack(dx = 0){
  fillRect(CARD.x0 + dx, CARD.y0, CARD.x1 + dx, CARD.y1, 0);
  frame(dx);
  blitHex(DORSO, BACK_W, BACK_H, 16 + dx, 14);

// Miniatura del arte a mitad de tamaño (OR de bloques 2x2)
function blitHexHalf(hex, w, h, x0, y0){
  const s = hex.replace(/\s+/g, ""), rowLen = w / 4;
  const bit = (x, y) => (parseInt(s[y * rowLen + (x >> 2)], 16) >> (3 - (x & 3))) & 1;
  for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2)
    if (bit(x,y) | bit(x+1,y) | bit(x,y+1) | bit(x+1,y+1)) px(x0 + x / 2, y0 + y / 2);
}

  y += 5;
  center(invertida ? "▼ INVERTIDA" : "▲ DERECHA", y); y += 13;
  for (const l of wrap(invertida ? cI : cD, 144, 1)){ center(l, y); y += 11; }
  hline(56, 95, 283);
  center("PRESIONÁ · OTRA CARTA", 287);
}
function screenCard(i, invertida){
  const [num, nombre, kD, fD, kI, fI] = CARTAS[i];
  clear();
  frame();
  center(num, 13);
  blitHex(ARTE[i], ART_W, ART_H, 28, 32);
  if (invertida) rotateRegion(CARD.x0, CARD.y0, CARD.x1, CARD.y1);
  let y = 180;
  y = block(nombre, y, 2);
  y += 3; hline(26, 125, y); y += 6;
  center(invertida ? "▼ INVERTIDA" : "▲ DERECHA", y); y += 15;
  y = block(invertida ? kI : kD, y, 2); y += 3;
  block(invertida ? fI : fD, y, 1);
}

// ─── Animaciones ──────────────────────────────────────────
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function einkRefresh(){
  // destello típico de refresco completo de tinta electrónica
  const keep = fb.slice();
  clear(1); flush(); await sleep(90);
  for (let i = 0; i < fb.length; i++) fb[i] = keep[i] ? 0 : 1; flush(); await sleep(70);
  clear(0); flush(); await sleep(80);
  fb.set(keep); flush();
}
async function shuffle(){
  const steps = [-34, 30, -24, 22, -14, 12, -6, 4, 0];
  let dots = 0;
  for (const dx of steps){
    const ghost = fb.slice();
    clear();
    drawBack(-dx * 0.5 | 0);
    drawBack(dx);
    // fantasma e-ink: restos del cuadro anterior
    for (let i = 0; i < fb.length; i++) if (ghost[i] && ((i * 7) % 5 === 0)) fb[i] = 1;
    fillRect(0, 176, FW - 1, FH - 1, 0);
    block("BARAJANDO", 200, 2);
    center(".".repeat(1 + (dots++ % 3)).padEnd(3, " "), 232);
    flush();
    await sleep(120);
  }
  await sleep(150);
}

function randInt(n){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }

// ─── Estado ───────────────────────────────────────────────
let busy = false, estado = "home", actual = null;
async function boot(){
  busy = true;
  clear(); flush(); await sleep(150);
  screenLogo(); await einkRefresh(); await sleep(1400);
  await typeHome();
  estado = "home"; busy = false;
}
async function draw(){
  busy = true;
  await shuffle();
  actual = { i: randInt(22), inv: randInt(2) === 1 };
  screenCard(actual.i, actual.inv);
  await einkRefresh();
  estado = "carta"; busy = false;
}
async function relato(){
  busy = true;
  screenRelato(actual.i, actual.inv);
  await einkRefresh();
  estado = "relato"; busy = false;
}
function shortPress(){
  if (busy) return;
  if (estado === "carta") relato(); else draw();
}
async function home(){
  if (busy) return;
  busy = true;
  await typeHome();
  estado = "home"; busy = false;
}

// ─── Botón: toque corto / mantener ────────────────────────
const btn = document.getElementById("btn");
let pressT = 0, longFired = false, longTimer = null;
function press(){
  pressT = performance.now(); longFired = false; btn.classList.add("down");
  try { navigator.vibrate && navigator.vibrate(12); } catch(e){}
  longTimer = setTimeout(() => { longFired = true; home(); }, 700);
}
function release(){
  btn.classList.remove("down");
  if (!pressT) return;
  clearTimeout(longTimer); pressT = 0;
  if (!longFired) shortPress();
}
for (const el of [btn, cv]){
  el.addEventListener("pointerdown", e => { e.preventDefault(); press(); });
  el.addEventListener("pointerup", release);
  el.addEventListener("pointerleave", () => { if (pressT){ clearTimeout(longTimer); pressT = 0; btn.classList.remove("down"); } });
  el.addEventListener("contextmenu", e => e.preventDefault());
}
let keyDown = false;
addEventListener("keydown", e => { if ((e.code === "Space" || e.code === "Enter") && !keyDown){ e.preventDefault(); keyDown = true; press(); } });
addEventListener("keyup", e => { if (e.code === "Space" || e.code === "Enter"){ keyDown = false; release(); } });

// ─── Escala de pantalla ───────────────────────────────────
function fit(){
  const availH = innerHeight - 170, availW = innerWidth - 80;
  let s = Math.min(availH / FH, availW / FW);
  if (s >= 2) s = Math.floor(s);
  s = Math.max(1, Math.min(s, 3));
  cv.style.width = (FW * s) + "px"; cv.style.height = (FH * s) + "px";
}
addEventListener("resize", fit); fit();
boot();

// ─── PWA: instalar y funcionar offline ────────────────────
if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
